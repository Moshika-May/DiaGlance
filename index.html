<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DiaGlance – เช็กความเสี่ยงเบาหวานแบบสบายๆ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600&family=Sriracha&display=swap">
<style>
:root{--bg:#f3f2f1;--fg:#161616;--opt:#fff;--bd:#aaa;--mut:#777;--pri:#000;--on:#fff;--track:#fff;--fill:#a0a0a0}
[data-theme=dark]{--bg:#161616;--fg:#f3f2f1;--opt:#232323;--bd:#5a5a5a;--mut:#999;--pri:#f3f2f1;--on:#161616;--track:#2a2a2a;--fill:#8a8a8a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.7 "Noto Sans Thai",system-ui,sans-serif}
main{position:relative;max-width:480px;margin:0 auto;padding:28px 16px 40px}
h1{font-size:1.15rem;font-weight:600;letter-spacing:.04em;text-align:center;margin:8px 0 24px}
h2{font-size:1.15rem;font-weight:600;text-align:center;margin:0 0 20px;line-height:1.6}
.sub{text-align:center;color:var(--mut);margin:0 0 8px}
.card{margin:36px 0}.card p{margin:10px 0}
.opt{display:block;position:relative}.opt input{position:absolute;opacity:0}
.opt span{display:block;padding:12px 18px;margin:10px 0;background:var(--opt);border:1px solid var(--bd);border-radius:999px;cursor:pointer;text-align:center;transition:.15s}
.opt span:hover{border-color:var(--fg)}
.opt input:checked+span{background:var(--pri);border-color:var(--pri);color:var(--on)}
.opt input:focus-visible+span{outline:2px solid var(--fg);outline-offset:3px}
.chk span{border-radius:22px}
button{display:block;width:auto;min-width:160px;height:48px;margin:20px auto 0;padding:0 28px;font:inherit;color:var(--on);background:var(--pri);border:0;border-radius:999px;cursor:pointer}
button:disabled{opacity:.3;cursor:default}
button.ghost{min-height:44px;height:auto;min-width:0;margin:4px auto 0;padding:10px 24px;background:none;color:var(--mut)}
button.ghost:hover{text-decoration:underline}
#t{position:absolute;top:20px;right:12px;min-width:0;width:40px;height:40px;margin:0;padding:0;background:none;color:var(--fg);border:1px solid var(--bd);font-size:1.1rem}
input[type=number]{width:100%;padding:12px 16px;font:inherit;color:var(--fg);background:var(--opt);border:1px solid var(--bd);border-radius:999px;text-align:center}
input[type=number]:focus{outline:none;border-color:var(--fg)}
.row{display:flex;gap:10px}.row label{flex:1;font-size:.9rem;color:var(--mut)}
.formula{background:var(--opt);border:1px solid var(--bd);border-radius:20px;padding:10px 16px;font-size:.9rem;margin:0 0 16px}
.bar{height:8px;background:var(--track);border-radius:4px;overflow:hidden;margin-bottom:24px}.bar i{display:block;height:100%;background:var(--fill);border-radius:4px;transition:width .3s}
.big{font-size:4rem;font-weight:600;text-align:center;line-height:1.2}.c{text-align:center}.mut{color:var(--mut);font-size:.85rem}
ul{padding-left:1.2em;margin:6px 0}li{margin:2px 0}
table{width:100%;border-collapse:collapse;font-size:.85rem}td,th{padding:8px 4px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
button.alt{background:none;color:var(--fg);border:1px solid var(--bd);min-width:0;margin:0}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:20px 0}.btns button{margin:0}
.hero{text-align:center;padding:36px 0 24px}.hero h2{font-size:2rem;line-height:1.35;margin:0 0 14px;text-wrap:balance}.hero p{color:var(--mut);margin:0 auto;max-width:28em;text-wrap:balance}
.info{border-top:1px solid var(--bd);padding:22px 0 6px}.info h3{font-size:.8rem;font-weight:600;color:var(--mut);margin:0 0 8px}.info p{margin:8px 0}
#card{width:100%;display:block;border-radius:24px;margin:8px 0}
details{margin:20px 0}summary{cursor:pointer;color:var(--mut);text-align:center}
</style>
<main>
<button id="t" aria-label="สลับโหมดมืด/สว่าง"></button>
<h1>DiaGlance</h1>
<div id="app"></div>
<p class="mut c">ทำเพื่อการเรียนรู้ ไม่ใช่การวินิจฉัยทางการแพทย์ · คำตอบไม่ถูกส่งออกจากเครื่องคุณ</p>
</main>
<script src="model.js"></script>
<script>
// โหมดมืด: ค่าเริ่มต้นตามระบบ จำค่าที่เลือกไว้ใน localStorage
const root = document.documentElement, T = document.getElementById('t');
let theme; try { theme = localStorage.theme; } catch {}
theme = theme || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
const paint = () => { root.dataset.theme = theme; T.textContent = theme === 'dark' ? '☀' : '☾'; };
let rerender;   // ตั้งค่าตอนอยู่หน้าผลลัพธ์ เพื่อวาดการ์ดใหม่เมื่อสลับธีม
T.onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; try { localStorage.theme = theme; } catch {} paint(); rerender?.(); };
paint();

const PRIOR = 0.101;   // P(D) จากไฟล์สรุป — แก้เลขนี้เพื่อเปลี่ยน prior
const Q = MODEL.q, ans = {}, app = document.getElementById('app');
// ขั้นตอนถามทั้งหมด: โรคประจำตัว (grp) รวมเป็นข้อติ๊กเดียว, การกินหวานแตกเป็น 3 ข้อย่อย
const HL = { heart: 'โรคหัวใจ หรือเคยหัวใจวาย', stroke: 'โรคหลอดเลือดสมอง (อัมพฤกษ์ อัมพาต)', kidney: 'โรคไต', asthma: 'หอบหืด', skin: 'มะเร็งผิวหนัง' };
const S = []; for (const q of Q) {
  if (q.grp) { if (!S.some(s => s.hist)) S.push({ k: 'hist', hist: 1, t: 'เคยมีหมอบอกไหมว่ามีเรื่องสุขภาพเหล่านี้? (เลือกได้หลายข้อ)' }); }
  else S.push(...(q.steps || [q]));
}
let i = 0;
const pct = x => (x * 100).toFixed(1) + '%';
const BMI_BIN = b => b < 18.5 ? 'b1' : b < 25 ? 'b2' : b < 30 ? 'b3' : b < 35 ? 'b4' : 'b5';

// ค่าของแต่ละปัจจัย (ตัวเลือกที่ผู้ใช้เห็นอาจละเอียดกว่าข้อมูล จึงแปลงกลับเป็นค่าที่ข้อมูลมี)
function val(q) {
  if (q.grp) return ans.hist ? (ans.hist.includes(q.k) ? 'y' : 'n') : undefined;
  if (q.ui) return ans[q.k] != null ? q.ui[ans[q.k]].v : undefined;
  if (!q.steps) return ans[q.k];
  const a = q.steps.map(s => ans[s.k]).filter(x => x != null).map(Number);   // กินหวาน: เฉลี่ย 3 ข้อ กันนับซ้ำ
  return a.length ? String(Math.round(a.reduce((x, y) => x + y) / a.length)) : undefined;
}
// Naive Bayes: P(D|x) = P(D)ΠP(xi|D) / [P(D)ΠP(xi|D) + P(¬D)ΠP(xi|¬D)]
function infer() {
  let d = PRIOR, n = 1 - PRIOR; const rows = [];
  for (const q of Q) {
    const o = q.o.find(o => o.v === val(q)); if (!o) continue;
    d *= o.pD; n *= o.pN; rows.push([q, o]);
  }
  return { p: d / (d + n), rows };
}

function home() {
  rerender = null;
  app.innerHTML = `<div class="hero"><h2>เช็กความเสี่ยงเบาหวาน<br>แบบสบายๆ</h2>
    <p>ตอบ ${S.length} ข้อสั้นๆ ไม่ถึง 3 นาที แล้วดูว่าโอกาสเป็นเบาหวานของคุณสูงหรือต่ำกว่าคนทั่วไปแค่ไหน พร้อมรูปสรุปผลสวยๆ ไว้แชร์</p>
    <button id="go">เริ่มเลย</button></div>
  <div class="info"><h3>เบาหวานคืออะไร</h3>
    <p>โรคที่น้ำตาลในเลือดสูงเรื้อรัง เพราะร่างกายสร้างอินซูลินไม่พอ หรือใช้อินซูลินได้ไม่ดี ชนิดที่พบบ่อยที่สุดคือ <b>ชนิดที่ 2</b> ซึ่งเกี่ยวกับน้ำหนัก การกิน และการใช้ชีวิต</p>
    <p>ตามไฟล์สรุปของโครงงานนี้ คนไทยเป็นกันราว <b>1 ใน 10</b> (10.1%) และหลายคน<b>ไม่รู้ตัว</b> เพราะช่วงแรกแทบไม่มีอาการ</p>
    <p class="mut">อาการที่พบได้: หิวน้ำบ่อย ปัสสาวะบ่อย เหนื่อยง่าย แผลหายช้า น้ำหนักลดโดยไม่รู้สาเหตุ</p></div>
  <div class="info"><h3>เว็บนี้ทำอะไร</h3>
    <p>เรานำข้อมูลสำรวจสุขภาพจริงราว 7.5 แสนคน มาดูว่า <b>คนที่เป็นเบาหวานมีลักษณะแบบคุณบ่อยกว่าคนที่ไม่เป็นแค่ไหน</b> แล้วใช้ความน่าจะเป็น (กฎของเบย์) ปรับโอกาสขึ้นหรือลงทีละข้อ จนได้ตัวเลขสุดท้าย พร้อมบอกว่าข้อไหนมีผลมากที่สุด</p>
    <p class="mut">ผลที่ได้เป็นแค่ภาพรวมเพื่อการเรียนรู้ ไม่ได้นับประวัติครอบครัวหรือผลเลือดจริง ถ้ากังวลควรตรวจน้ำตาลในเลือดกับแพทย์</p></div>`;
  app.querySelector('#go').onclick = () => { i = 0; ask(); };
}

function ask() {
  rerender = null;
  const q = S[i], bar = `<div class="bar"><i style="width:${i / S.length * 100}%"></i></div>`;
  const back = '<button class="ghost" id="b">← ย้อนกลับ</button>';
  const next = v => { v == null ? delete ans[q.k] : ans[q.k] = v; ++i < S.length ? ask() : done(); };
  const head = `<h2>${i + 1}/${S.length} · ${q.t}</h2>`, skip = '<button class="ghost" id="s">ไม่ทราบ / ข้าม</button>';
  if (q.k === 'bmi') {
    app.innerHTML = `${bar}<div class="card">${head}
    <div class="formula">สูตร: BMI = น้ำหนัก (กก.) ÷ ส่วนสูง (ม.)²<br>เช่น 60 กก. สูง 1.60 ม. → 60 ÷ 2.56 = 23.4</div>
    <div class="row"><label>ส่วนสูง (ซม.)<input type="number" id="h" inputmode="decimal" min="100" max="250"></label>
    <label>น้ำหนัก (กก.)<input type="number" id="w" inputmode="decimal" min="25" max="300"></label></div>
    <p class="c" id="r">&nbsp;</p><button id="go" disabled>ต่อไป</button>${skip}</div>${back}`;
    const h = app.querySelector('#h'), w = app.querySelector('#w'), go = app.querySelector('#go');
    let bin;
    const calc = () => {
      const m = h.value / 100, b = w.value / (m * m);
      bin = h.value >= 100 && h.value <= 250 && w.value >= 25 && w.value <= 300 ? BMI_BIN(b) : null;
      go.disabled = !bin;
      app.querySelector('#r').innerHTML = bin ? `BMI ของคุณ <b>${b.toFixed(1)}</b> · ${q.o.find(o => o.v === bin).l}` : '&nbsp;';
    };
    h.oninput = w.oninput = calc; go.onclick = () => next(bin);
  } else if (q.hist) {
    const sel = ans.hist || [], ks = [...Object.keys(HL), 'none'];
    app.innerHTML = `${bar}<div class="card">${head}
    ${ks.map(k => `<label class="opt chk"><input type="checkbox" value="${k}" ${sel.includes(k) || (k === 'none' && ans.hist && !sel.length) ? 'checked' : ''}><span>${HL[k] || 'ไม่มีเลย'}</span></label>`).join('')}
    <button id="go">ต่อไป</button>${skip}</div>${back}`;
    const bx = [...app.querySelectorAll('input')];
    bx.forEach(e => e.onchange = () => bx.forEach(o => { if (o !== e && e.checked && (e.value === 'none' || o.value === 'none')) o.checked = false; }));
    app.querySelector('#go').onclick = () => { ans.hist = bx.filter(e => e.checked && e.value !== 'none').map(e => e.value); ++i < S.length ? ask() : done(); };
  } else {
    const opts = q.ui || q.o, val = (o, n) => q.ui ? String(n) : o.v;
    app.innerHTML = `${bar}<div class="card">${head}
    ${opts.map((o, n) => `<label class="opt"><input type="radio" name="a" value="${val(o, n)}" ${ans[q.k] === val(o, n) ? 'checked' : ''}><span>${o.l}</span></label>`).join('')}
    ${skip}</div>${back}`;
    app.querySelectorAll('input').forEach(e => e.onclick = () => next(e.value));   // onclick (ไม่ใช่ onchange) เพื่อให้กดข้อเดิมซ้ำหลังย้อนกลับได้
  }
  app.querySelector('#s').onclick = () => { if (q.hist) delete ans.hist; next(); };
  app.querySelector('#b').onclick = () => { i ? (i--, ask()) : home(); };
}

// ตัวละครผลลัพธ์ 4 แบบตามระดับความเสี่ยง
const PERSONA = [
  { max: .05, col: '#2dd4bf', lv: 'ความเสี่ยงต่ำมาก', name: 'หยดน้ำใส', en: 'CLEAR DROP', tag: 'LOW', short: 'น้ำใส', desc: 'โอกาสเป็นเบาหวานของคุณต่ำกว่าคนทั่วไปมาก ไลฟ์สไตล์ตอนนี้เป็นมิตรกับร่างกาย รักษาแบบนี้ไว้นะ' },
  { max: .1, col: '#84cc16', lv: 'ความเสี่ยงค่อนข้างต่ำ', name: 'หยดสมดุล', en: 'STEADY DROP', tag: 'STEADY', short: 'สมดุล', desc: 'ต่ำกว่าหรือใกล้เคียงคนทั่วไป ทุกอย่างค่อนข้างพอดี ขยับตัวเพิ่มอีกนิดก็ยิ่งดี' },
  { max: .3, col: '#f59e0b', lv: 'ความเสี่ยงปานกลาง', name: 'หยดเฝ้าระวัง', en: 'WATCHFUL DROP', tag: 'WATCH', short: 'เฝ้าระวัง', desc: 'สูงกว่าคนทั่วไปอยู่บ้าง มีบางปัจจัยที่ลองปรับได้ และการตรวจน้ำตาลในเลือดสักครั้งก็ไม่เสียหาย' },
  { max: 2, col: '#f43f5e', lv: 'ความเสี่ยงสูง', name: 'หยดหวานจัด', en: 'SUGAR RUSH', tag: 'HIGH', short: 'หวานจัด', desc: 'สูงกว่าคนทั่วไปค่อนข้างมาก ไม่ต้องตกใจ แต่ลองปรึกษาแพทย์และตรวจน้ำตาลในเลือดดูนะ' },
];
const PI = p => PERSONA.findIndex(x => p < x.max);
const LV = p => [PERSONA[PI(p)].lv, PERSONA[PI(p)].col];
const label = (q, o) => q.grp ? (o.v === 'y' ? 'มี' : 'ไม่มี') : q.ui ? q.ui[ans[q.k]].l : o.l;

// ---- ตัวช่วยวาด ----
function sparkle(x, cx, cy, r, col) {
  x.fillStyle = col; x.beginPath(); x.moveTo(cx, cy - r);
  for (const [px, py] of [[cx + r, cy], [cx, cy + r], [cx - r, cy], [cx, cy - r]]) x.quadraticCurveTo(cx, cy, px, py);
  x.fill();
}
function drawBlob(x, cx, cy, s, col, mood, a = 1) {   // หยดน้ำตาลหน้าตาน่ารัก mood 0-3 = ยิ้ม/สบายๆ/กังวล/ตกใจ
  x.save(); x.globalAlpha = a;
  x.beginPath(); x.moveTo(cx, cy - 1.1 * s);
  x.bezierCurveTo(cx + .25 * s, cy - .7 * s, cx + .9 * s, cy - .2 * s, cx + .9 * s, cy + .3 * s);
  x.bezierCurveTo(cx + .9 * s, cy + .85 * s, cx + .5 * s, cy + s, cx, cy + s);
  x.bezierCurveTo(cx - .5 * s, cy + s, cx - .9 * s, cy + .85 * s, cx - .9 * s, cy + .3 * s);
  x.bezierCurveTo(cx - .9 * s, cy - .2 * s, cx - .25 * s, cy - .7 * s, cx, cy - 1.1 * s);
  x.fillStyle = col; x.fill();
  x.fillStyle = 'rgba(255,255,255,.38)'; x.beginPath(); x.ellipse(cx - .5 * s, cy + .1 * s, .1 * s, .26 * s, -.45, 0, 7); x.fill();
  x.fillStyle = 'rgba(255,90,120,.4)'; for (const d of [-1, 1]) { x.beginPath(); x.ellipse(cx + d * .52 * s, cy + .52 * s, .11 * s, .065 * s, 0, 0, 7); x.fill(); }
  x.fillStyle = '#161616'; const er = mood === 3 ? [.1, .14] : [.075, .105];
  for (const d of [-1, 1]) { x.beginPath(); x.ellipse(cx + d * .3 * s, cy + .3 * s, er[0] * s, er[1] * s, 0, 0, 7); x.fill(); }
  x.strokeStyle = '#161616'; x.lineWidth = Math.max(2, .05 * s); x.lineCap = 'round'; x.beginPath();
  if (mood === 0) x.arc(cx, cy + .42 * s, .2 * s, .12 * Math.PI, .88 * Math.PI);
  else if (mood === 1) x.arc(cx, cy + .5 * s, .11 * s, .2 * Math.PI, .8 * Math.PI);
  else if (mood === 2) { x.moveTo(cx - .13 * s, cy + .64 * s); x.quadraticCurveTo(cx - .065 * s, cy + .56 * s, cx, cy + .64 * s); x.quadraticCurveTo(cx + .065 * s, cy + .72 * s, cx + .13 * s, cy + .64 * s); }
  if (mood < 3) x.stroke(); else { x.fillStyle = '#161616'; x.beginPath(); x.ellipse(cx, cy + .64 * s, .1 * s, .14 * s, 0, 0, 7); x.fill(); }
  if (mood >= 2) { x.fillStyle = '#7dd3fc'; for (const [dx, dy, k] of mood === 2 ? [[.72, -.05, 1]] : [[.72, -.05, 1], [-.74, .1, .8]]) {
    x.beginPath(); x.moveTo(cx + dx * s, cy + (dy - .14 * k) * s); x.quadraticCurveTo(cx + (dx + .1 * k) * s, cy + dy * s, cx + dx * s, cy + (dy + .07 * k) * s); x.quadraticCurveTo(cx + (dx - .1 * k) * s, cy + dy * s, cx + dx * s, cy + (dy - .14 * k) * s); x.fill(); } }
  x.restore();
}
function wrap(x, t, w) {   // ตัดบรรทัดตามคำไทย (Intl.Segmenter) ถ้าเบราว์เซอร์ไม่รองรับก็ตัดทีละตัวอักษร
  const seg = typeof Intl.Segmenter === 'function' ? [...new Intl.Segmenter('th', { granularity: 'word' }).segment(t)].map(s => s.segment) : [...t];
  const lines = []; let l = '';
  for (const s of seg) { if (x.measureText(l + s).width > w && l) { lines.push(l.trim()); l = s; } else l += s; }
  return [...lines, l.trim()];
}

// วาดการ์ดสรุปผล 1080x1680 ตามธีมที่เลือกอยู่ — ใช้ทั้งแสดงบนหน้าและบันทึก/แชร์เป็นรูป
async function drawCard(p, top) {
  await Promise.all([['400', 'Noto Sans Thai'], ['600', 'Noto Sans Thai'], ['400', 'Sriracha']].map(([w, f]) => document.fonts.load(`${w} 30px "${f}"`, 'ก')));
  const dark = root.dataset.theme === 'dark', W = 1080, H = 1700, cx = W / 2;
  const T = dark ? { bg: '#161616', ink: '#f3f2f1', mut: '#9a9a9a', line: '#4a4a4a', track: '#2a2a2a' } : { bg: '#f3f2f1', ink: '#161616', mut: '#777', line: '#b9b6b2', track: '#e2dfdb' };
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'), P = PERSONA[PI(p)], idx = PI(p), F = (w, s) => `${w} ${s}px "Noto Sans Thai",system-ui,sans-serif`;
  x.fillStyle = T.bg; x.fillRect(0, 0, W, H); x.textAlign = 'center';
  x.fillStyle = T.ink; x.font = F(600, 32); x.letterSpacing = '10px'; x.fillText('DIAGLANCE', cx, 84); x.letterSpacing = '0px';
  // ตัวละครหลัก + ลายเส้นประกาย
  const my = 440, ms = 230;
  x.strokeStyle = P.col; x.lineWidth = 9; x.lineCap = 'round';
  for (let k = 0; k < 9; k++) { const a = Math.PI * (1.08 + k * .105), r1 = ms * 1.22, r2 = r1 + (k % 2 ? 36 : 66);
    x.beginPath(); x.moveTo(cx + r1 * Math.cos(a), my + 20 + r1 * Math.sin(a)); x.lineTo(cx + r2 * Math.cos(a), my + 20 + r2 * Math.sin(a)); x.stroke(); }
  sparkle(x, cx - 330, my + 150, 34, P.col); sparkle(x, cx + 340, my + 60, 26, P.col); sparkle(x, cx + 290, my + 260, 18, P.col); sparkle(x, cx - 280, my - 60, 16, P.col);
  drawBlob(x, cx, my, ms, P.col, idx);
  x.fillStyle = T.ink; x.font = '400 104px Sriracha,"Noto Sans Thai",sans-serif'; x.fillText(P.name, cx, 778);
  x.fillStyle = T.mut; x.font = F(600, 32); x.letterSpacing = '14px'; x.fillText(P.en, cx + 7, 832); x.letterSpacing = '0px';
  // กรอบเนื้อหา
  x.strokeStyle = T.line; x.lineWidth = 2; x.beginPath(); x.roundRect(70, 885, W - 140, 735, 56); x.stroke();
  x.textAlign = 'left'; x.fillStyle = T.mut; x.font = F(400, 28); x.fillText('โอกาสเป็นเบาหวาน', 130, 955);
  x.textAlign = 'right'; x.font = F(600, 24); const tw = x.measureText(P.tag).width + 48;
  x.fillStyle = P.col; x.beginPath(); x.roundRect(W - 130 - tw, 923, tw, 44, 22); x.fill();
  x.fillStyle = '#161616'; x.textAlign = 'center'; x.fillText(P.tag, W - 130 - tw / 2, 955);
  x.fillStyle = T.ink; x.font = F(600, 140); x.fillText(pct(p), cx, 1072);
  // แถบสเกล (รากที่สอง เต็ม = 60%) พร้อมขีดค่าเฉลี่ยคนทั่วไป
  const bx = 150, bw = 780, pos = v => bx + Math.sqrt(Math.min(v, .6) / .6) * bw, by = 1142;
  x.fillStyle = T.track; x.beginPath(); x.roundRect(bx, by, bw, 18, 9); x.fill();
  const gr = x.createLinearGradient(bx, 0, bx + bw, 0); gr.addColorStop(0, '#2dd4bf'); gr.addColorStop(.5, '#f59e0b'); gr.addColorStop(1, '#f43f5e');
  x.fillStyle = gr; x.beginPath(); x.roundRect(bx, by, Math.max(pos(p) - bx, 18), 18, 9); x.fill();
  x.fillStyle = T.ink; x.fillRect(pos(PRIOR) - 1.5, by - 12, 3, 42);
  x.font = F(400, 22); x.fillText('คนทั่วไป ' + pct(PRIOR), pos(PRIOR), by - 22);
  x.beginPath(); x.arc(Math.max(pos(p), bx + 9), by + 9, 19, 0, 7); x.fillStyle = T.bg; x.fill(); x.lineWidth = 7; x.strokeStyle = P.col; x.stroke();
  x.fillStyle = T.mut; x.font = F(400, 22); x.textAlign = 'left'; x.fillText('0%', bx, by + 56); x.textAlign = 'right'; x.fillText('60%+', bx + bw, by + 56);
  // คำอธิบาย
  x.textAlign = 'center'; x.fillStyle = T.ink; x.font = F(400, 31);
  wrap(x, P.desc, 800).forEach((l, n) => x.fillText(l, cx, 1276 + n * 46));
  // ปัจจัยเด่น คั่นด้วยประกาย
  let tr = top.slice(0, 3).map(f => ({ t: f.name.replace(/ \(.*/, '') + (f.ln > 0 ? ' ↑' : ' ↓'), up: f.ln > 0 }));
  x.font = F(600, 27); const gap = 72, tot = a => a.reduce((s, f) => s + x.measureText(f.t).width, 0) + gap * (a.length - 1);
  if (tot(tr) > 820) tr = tr.slice(0, 2);
  if (tr.length) { let px = cx - tot(tr) / 2; x.textAlign = 'left';
    tr.forEach((f, n) => { x.fillStyle = T.ink; x.fillText(f.t, px, 1422); px += x.measureText(f.t).width; if (n < tr.length - 1) { sparkle(x, px + gap / 2, 1413, 11, T.ink); px += gap; } }); }
  // แก๊งหยด: ทั้ง 4 แบบ ตัวที่ได้เด่นสุด
  x.textAlign = 'center'; x.fillStyle = T.ink; x.font = F(600, 28); x.fillText('แก๊งหยด', cx, 1488);
  PERSONA.forEach((q, n) => { const bxn = cx + (n - 1.5) * 190, on = n === idx;
    drawBlob(x, bxn, 1536, on ? 40 : 32, q.col, n, on ? 1 : .35);
    x.fillStyle = on ? T.ink : T.mut; x.font = F(on ? 600 : 400, 20); x.fillText(q.short, bxn, 1596); });
  x.fillStyle = T.mut; x.font = F(400, 22); x.fillText('เพื่อการเรียนรู้ ไม่ใช่การวินิจฉัยทางการแพทย์', cx, 1672);
  return c;
}

async function done() {
  const { p, rows } = infer();
  const fs = rows.map(([q, o]) => ({ name: q.name || q.t, ans: label(q, o), lr: o.pD / o.pN, ln: Math.log(o.pD / o.pN), assumed: q.assumed }))
    .filter(f => Math.abs(f.ln) >= .08).sort((a, b) => Math.abs(b.ln) - Math.abs(a.ln));
  const up = fs.filter(f => f.ln > 0).slice(0, 3), dn = fs.filter(f => f.ln < 0).slice(0, 3);
  const list = a => a.map(f => `${f.name} (${f.ans})`).join(', ') || '—';
  const text = `DiaGlance: โอกาสเป็นเบาหวาน ${pct(p)} (คนทั่วไป ${pct(PRIOR)}) · ${LV(p)[0]}\nดันความเสี่ยงขึ้น: ${list(up)}\nช่วยลดความเสี่ยง: ${list(dn)}\n(เพื่อการเรียนรู้ ไม่ใช่การวินิจฉัยทางการแพทย์)`;
  app.innerHTML = '<p class="c mut">กำลังสร้างรูปสรุป…</p>';
  let cv = await drawCard(p, fs), url = cv.toDataURL('image/png');
  app.innerHTML = `<img id="card" src="${url}" alt="${text.replace(/"/g, '')}">
  <div class="btns"><button id="sv">บันทึกรูป / แชร์</button><button id="cp" class="alt">คัดลอกสรุป</button></div>
  <div class="card"><p><b>ดันความเสี่ยงขึ้น:</b> ${list(up)}</p><p><b>ช่วยลดความเสี่ยง:</b> ${list(dn)}</p></div>
  <details><summary>ดูรายละเอียดทุกข้อ</summary><table><tr><th>ปัจจัย</th><th>คำตอบ</th><th>เท่าตัว*</th></tr>
  ${rows.map(([q, o]) => `<tr><td>${q.name || q.t}${q.assumed ? ' <i>(ค่าสมมติ)</i>' : ''}</td><td>${label(q, o)}</td><td>×${(o.pD / o.pN).toFixed(2)}</td></tr>`).join('') || '<tr><td colspan=3>ไม่ได้ตอบข้อใดเลย</td></tr>'}</table>
  <p class="mut">*P(x|เป็นเบาหวาน) ÷ P(x|ไม่เป็น) — มากกว่า 1 เพิ่มความเสี่ยง น้อยกว่า 1 ลดความเสี่ยง<br>
  คำนวณด้วย Naive Bayes จาก BRFSS 2020+2022 (${MODEL.n.toLocaleString()} คน สหรัฐฯ ไม่ใช่ข้อมูลไทย)
  <br>ข้อสูบบุหรี่/แอลกอฮอล์/ออกกำลังกาย/การเดิน: ข้อมูลเก็บแค่ ใช่-ไม่ใช่ จึงรวมตัวเลือกของคุณเป็น 2 กลุ่มก่อนคำนวณ
  <br>ปัจจัยกินหวาน (ค่าสมมติ): ข้อมูลชุดนี้ไม่มีตัวแปรนี้ จึงใช้ตัวเลขตัวอย่างจากไฟล์สรุปแทน</p></details>
  <button id="r" class="alt">ทำใหม่อีกครั้ง</button>`;
  rerender = async () => { cv = await drawCard(p, fs); url = cv.toDataURL('image/png'); app.querySelector('#card').src = url; };
  app.querySelector('#sv').onclick = () => cv.toBlob(async b => {
    const f = new File([b], 'diaglance.png', { type: 'image/png' });
    if (navigator.canShare?.({ files: [f] })) { try { await navigator.share({ files: [f], text }); } catch {} return; }   // มือถือ: เปิดหน้าต่างแชร์
    const a = document.createElement('a'); a.href = url; a.download = 'diaglance.png'; a.click();                        // คอม: ดาวน์โหลด
  });
  app.querySelector('#cp').onclick = e => navigator.clipboard.writeText(text).then(() => e.target.textContent = 'คัดลอกแล้ว ✓').catch(() => prompt('คัดลอกข้อความนี้', text));
  app.querySelector('#r').onclick = () => { for (const k in ans) delete ans[k]; home(); };
}
home();
</script>
